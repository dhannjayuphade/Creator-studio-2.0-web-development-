<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f4d" />
      <stop offset="50%" stop-color="#060a17" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <rect width="512" height="512" rx="112" fill="url(#cyberGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#neonCyan)" stroke-width="8" opacity="0.8" />
  
  <!-- Circuit Accent Lines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="16 12" opacity="0.35" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="10 14" opacity="0.4" />

  <!-- Center 2.0 Typography -->
  <g filter="url(#neonGlow)">
    <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="url(#neonCyan)" text-anchor="middle" letter-spacing="-4">2.0</text>
    <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#00f0ff" text-anchor="middle" letter-spacing="8">CREATOR STUDIO</text>
    <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="4">WEB &amp; ANDROID APK</text>
  </g>

  <!-- Android & Code Badges -->
  <circle cx="256" cy="115" r="22" fill="#10b981" />
  <path d="M246 115 L253 122 L266 109" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
